<script>
async function loadLeaderboard() {
  const response = await fetch('data.json');
  const players = await response.json();

  const container = document.getElementById('leaderboard');

  players.forEach(player => {
    const name = player.name;

    const block = document.createElement('div');
    block.style.marginBottom = '15px';

    // Player name (Wikipedia link)
    const title = document.createElement('div');
    title.innerHTML = `<a href="https://en.wikipedia.org/wiki/${encodeURIComponent(name)}" target="_blank"><strong>${name}</strong></a>`;
    block.appendChild(title);

    // Helper to create indented links
    function createOption(label, query) {
      const row = document.createElement('div');
      row.style.marginLeft = '20px';
      row.innerHTML = `<a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank">${label}</a>`;
      return row;
    }

    block.appendChild(createOption("Wife or GF", name + " wife"));
    block.appendChild(createOption("Net worth", name + " net worth"));
    block.appendChild(createOption("Total PGA earnings", name + " PGA earnings"));

    container.appendChild(block);
  });
}

loadLeaderboard();
</script>
