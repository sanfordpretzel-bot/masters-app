<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masters App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .player-block {
      margin-bottom: 18px;
    }
    .player-name a {
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      color: black;
    }
    .meta {
      color: #666;
      margin-top: 4px;
    }
    .option-row {
      margin-left: 40px;
      margin-top: 4px;
    }
    .option-row a {
      text-decoration: none;
      color: #0066cc;
    }
    .error {
      color: red;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Masters Leaderboard</h1>
  <div id="leaderboard">Loading...</div>

  <script>
    async function loadLeaderboard() {
      const container = document.getElementById('leaderboard');

      try {
        const response = await fetch('data.json?v=' + Date.now());
        if (!response.ok) {
          throw new Error('Could not load data.json');
        }

        const data = await response.json();
        const players = data.players || [];

        if (!players.length) {
          container.innerHTML = '<div class="error">No players found in data.json</div>';
          return;
        }

        container.innerHTML = '';

        players.forEach(player => {
          const name = player.name || 'Unknown Player';
          const position = player.position || '';
          const score = player.score || '';
          const thru = player.thru || '';

          const block = document.createElement('div');
          block.className = 'player-block';

          const nameRow = document.createElement('div');
          nameRow.className = 'player-name';
          nameRow.innerHTML =
            '<a href="https://en.wikipedia.org/wiki/Special:Search?search=' +
            encodeURIComponent(name) +
            '" target="_blank">' +
            name +
            '</a>';
          block.appendChild(nameRow);

          const metaRow = document.createElement('div');
          metaRow.className = 'meta';
          metaRow.textContent = 'Position: ' + position + ' | Score: ' + score + ' | Thru: ' + thru;
          block.appendChild(metaRow);

          function addOption(label, query) {
            const row = document.createElement('div');
            row.className = 'option-row';
            row.innerHTML =
              '<a href="https://www.google.com/search?q=' +
              encodeURIComponent(query) +
              '" target="_blank">' +
              label +
              '</a>';
            block.appendChild(row);
          }

          addOption('Wife or GF', name + ' wife OR girlfriend');
          addOption('Net worth', name + ' net worth');
          addOption('Total PGA earnings', name + ' career PGA earnings');

          container.appendChild(block);
        });
      } catch (err) {
        container.innerHTML = '<div class="error">Error: ' + err.message + '</div>';
      }
    }

    loadLeaderboard();
  </script>
</body>
</html>
