name: Update leaderboard

on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Refresh data.json
        run: |
          cat > refresh_data.py <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          ROOT = Path.cwd()
          DATA_FILE = ROOT / "data.json"

          PAGES = [
              {
                  "name": "Masters.com LIVE scores feed",
                  "url": "https://www.masters.com/en_US/scores/feeds/scores.json",
                  "kind": "json",
              },
              {
                  "name": "Masters.com leaderboard page",
                  "url": "https://www.masters.com/leaderboard",
                  "kind": "html",
              },
              {
                  "name": "ESPN Masters leaderboard",
                  "url": "https://www.espn.com/golf/leaderboard?season=2025&tournamentId=401811941",
                  "kind": "html",
              },
          ]

          def clean(text):
              return re.sub(r"\s+", " ", (text or "").replace("\xa0", " ")).strip()

          def normalize_thru(value):
              text = clean(value)
              if not text:
                  return "—"
              lower = text.lower()
              if lower in {"f", "fin", "finish", "finished"}:
                  return "F"
              return text

          def parse_position(value):
              text = clean(value)
              if not text:
                  return 9999
              text = re.sub(r"^T", "", text, flags=re.I)
              m = re.search(r"\d+", text)
              return int(m.group()) if m else 9999

          def dedupe(players):
              seen = set()
              out = []
              for player in players:
                  name = clean(player.get("name", ""))
                  if not name:
                      continue
                  key = (player.get("position", ""), name)
                  if key in seen:
                      continue
                  seen.add(key)
                  out.append({
                      "position": clean(player.get("position", "")) or "—",
                      "name": name,
                      "score": clean(player.get("score", "")) or "E",
                      "today": clean(player.get("today", "")) or "E",
                      "thru": normalize_thru(player.get("thru", "")),
                  })
              out.sort(key=lambda p: (parse_position(p["position"]), p["name"]))
              return out

          def from_masters_json(payload):
              candidates = []
              if isinstance(payload, dict):
                  for key in ("leaderboard", "players", "competitors", "entries"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          candidates = value
                          break
                      if isinstance(value, dict):
                          for nested_key in ("players", "competitors", "entries"):
                              nested = value.get(nested_key)
                              if isinstance(nested, list):
                                  candidates = nested
                                  break

              players = []
              for row in candidates:
                  if not isinstance(row, dict):
                      continue

                  name = clean(
                      row.get("name")
                      or row.get("player_name")
                      or row.get("full_name")
                      or row.get("display_name")
                      or f"{row.get('first_name', '')} {row.get('last_name', '')}"
                  )

                  if len(name.split()) < 2:
                      continue

                  position = clean(row.get("position") or row.get("pos") or row.get("rank"))
                  score = clean(row.get("score") or row.get("total") or row.get("to_par"))
                  today = clean(row.get("today") or row.get("today_score") or row.get("round_score"))

                  # KEY FIX: handle live hole vs tee time
                  thru = clean(
                      row.get("thru")
                      or row.get("through")
                      or row.get("hole")
                      or row.get("status")
                  )

                  players.append({
                      "position": position,
                      "name": name,
                      "score": score,
                      "today": today,
                      "thru": thru,
                  })

              return dedupe(players)

          def from_html_table(html):
              soup = BeautifulSoup(html, "html.parser")
              players = []

              for tr in soup.select("tr"):
                  cells = [clean(td.get_text(" ", strip=True)) for td in tr.select("th, td")]
                  if len(cells) < 4:
                      continue

                  pos = cells[0]
                  if pos.lower() in {"pos", "position"}:
                      continue

                  name = ""
                  for cell in cells[1:4]:
                      if len(cell.split()) >= 2:
                          name = cell
                          break

                  if not name:
                      continue

                  score = ""
                  today = ""
                  thru = ""

                  if name in cells:
                      idx = cells.index(name)
                      after = cells[idx + 1 : idx + 5]
                      if after:
                          score = after[0] if len(after) > 0 else ""
                          today = after[1] if len(after) > 1 else ""
                          thru = after[2] if len(after) > 2 else ""

                  players.append({
                      "position": pos,
                      "name": name,
                      "score": score,
                      "today": today,
                      "thru": thru,
                  })

              return dedupe(players)

          def fetch_players():
              headers = {
                  "User-Agent": "Mozilla/5.0",
                  "Accept-Language": "en-US,en;q=0.9",
              }

              for source in PAGES:
                  try:
                      r = requests.get(source["url"], timeout=25, headers=headers)
                      r.raise_for_status()

                      if source["kind"] == "json":
                          players = from_masters_json(r.json())
                      else:
                          players = from_html_table(r.text)

                      if players:
                          return source["name"], source["url"], players
                  except:
                      continue

              raise RuntimeError("No valid data source")

          def main():
              try:
                  source_name, source_url, players = fetch_players()

                  payload = {
                      "updated_at": datetime.now(timezone.utc).isoformat(),
                      "source_name": source_name,
                      "source_url": source_url,
                      "note": "Auto-updated",
                      "players": players,
                  }

              except Exception as e:
                  payload = {
                      "updated_at": datetime.now(timezone.utc).isoformat(),
                      "note": f"Failed update: {e}",
                      "players": [],
                  }

              DATA_FILE.write_text(json.dumps(payload, indent=2))

          if __name__ == "__main__":
              main()
          PY

          python refresh_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update leaderboard" || exit 0
          git push
